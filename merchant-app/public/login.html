<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - TechZone</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .auth-container {
      max-width: 400px;
      margin: 80px auto;
      background: var(--surface);
      padding: 2rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-header h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .auth-header p { color: var(--text-muted); font-size: 0.9rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; }
    .form-group input { 
      width: 100%; 
      padding: 0.75rem; 
      border-radius: var(--radius-sm); 
      border: 1px solid var(--border); 
      background: var(--surface-2); 
      color: var(--text); 
    }
    .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 1rem; text-align: center; }
  </style>
</head>
<body>
  <nav>
    <a class="nav-brand" href="/"><i data-lucide="zap"></i> TechZone</a>
  </nav>

  <div class="auth-container">
    <div class="auth-header">
      <h1>Welcome Back</h1>
      <p>Sign in to your TechZone account</p>
    </div>
    
    <form id="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="vikram.nair@example.com" value="vikram.nair@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="password" value="password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      <div id="error-msg" class="error-msg"></div>
    </form>
    
    <div style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;">
      <strong>Demo Accounts:</strong><br>
      Customer: <code>vikram.nair@example.com</code> / <code>password</code><br>
      Admin: <code>admin@techzone.com</code> / <code>admin</code>
    </div>
  </div>

  <script>
    lucide.createIcons();
    
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        if (data.success) {
          if (data.user.role === 'admin') {
            window.location.href = '/admin';
          } else {
            window.location.href = '/';
          }
        } else {
          errorMsg.textContent = data.error || 'Login failed';
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      } catch (err) {
        errorMsg.textContent = 'Server error';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - TechZone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <nav>
    <a class="nav-brand" href="/"><i data-lucide="zap"></i> TechZone</a>
    <div class="nav-links"></div>
  </nav>
  <script src="/auth.js"></script>

  <div class="container">
    <div class="orders-container">
      <div class="orders-header">
        <h1>My Orders</h1>
        <p>Your purchase history</p>
      </div>

      <div id="loading" class="orders-loading">
        <div class="orders-spinner"></div>
        Loading orders&hellip;
      </div>
      <div id="orders-list"></div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    async function fetchOrders() {
      try {
        const res = await fetch('/api/auth/my-orders');
        const data = await res.json();
        const list = document.getElementById('orders-list');
        document.getElementById('loading').style.display = 'none';

        if (!data.success) {
          list.innerHTML = `<p style="color:var(--danger)">Error: ${data.error}</p>`;
          return;
        }

        if (data.orders.length === 0) {
          list.innerHTML = `
            <div class="orders-empty">
              <i data-lucide="shopping-bag"></i>
              <p>You haven't placed any orders yet.</p>
              <a href="/" class="btn btn-primary">Start Shopping</a>
            </div>`;
          lucide.createIcons();
          return;
        }

        list.innerHTML = data.orders.map(order => {
          let statusClass = 'status-created';
          let indicatorClass = 'default';
          if (order.status === 'paid') { statusClass = 'status-paid'; indicatorClass = 'paid'; }
          if (order.status === 'failed') { statusClass = 'status-failed'; indicatorClass = 'failed'; }

          const amountStr = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(order.amount / 100);
          const dateStr = new Date(order.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

          let actionBtn = '';
          if (order.status === 'failed' || order.status === 'created') {
            actionBtn = `<a href="/retry?token=${order.retryToken}" class="btn btn-primary retry-btn"><i data-lucide="refresh-cw"></i> Retry Payment</a>`;
          }

          return `
            <div class="order-card">
              <div class="order-status-indicator ${indicatorClass}"></div>
              <div class="order-body">
                <h3 class="order-product-name">${order.product.name}</h3>
                <div class="order-meta">
                  <span><i data-lucide="hash"></i>${order.id}</span>
                  <span><i data-lucide="calendar"></i>${dateStr}</span>
                </div>
              </div>
              <div class="order-right">
                <div class="order-amount">${amountStr}</div>
                <div class="order-status ${statusClass}">${order.status}</div>
                ${actionBtn}
              </div>
            </div>
          `;
        }).join('');
        lucide.createIcons();
      } catch (err) {
        document.getElementById('loading').innerHTML = '<p style="color:var(--danger)">Error loading orders.</p>';
      }
    }

    // Make sure user is logged in first
    fetch('/api/auth/me').then(res => res.json()).then(data => {
      if (!data.success || !data.user || data.user.role === 'admin') {
        window.location.href = '/login';
      } else {
        fetchOrders();
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Successful &mdash; TechZone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<nav>
  <a class="nav-brand" href="/"><i data-lucide="zap"></i> TechZone</a>
  <div class="nav-links"></div>
</nav>
<script src="/auth.js"></script>

<div class="container">
  <div class="success-card">
    <div class="success-icon"><i data-lucide="party-popper"></i></div>
    <h1>Payment Successful!</h1>
    <p>Your order has been placed and payment captured successfully.</p>

    <div class="payment-id" id="payment-details">
      Loading payment details&hellip;
    </div>

    <a href="/" class="btn btn-primary btn-block" style="text-decoration:none;">
      <i data-lucide="arrow-left"></i> Continue Shopping
    </a>
    <br />
    <a href="/admin" class="success-admin-link">
      View in Admin Panel <i data-lucide="arrow-right"></i>
    </a>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const paymentId = params.get('payment_id');
  const orderId = params.get('order_id');
  const isSimulated = params.get('simulated') === '1';

  const details = document.getElementById('payment-details');
  const simBadge = isSimulated
    ? `<div class="simulated-badge"><i data-lucide="flask-conical" style="width:.85em;height:.85em;vertical-align:-.1em;"></i> Simulated Payment</div>`
    : '';

  if (paymentId && orderId) {
    details.innerHTML = `
      <div class="pid-label">Payment ID</div>
      <strong>${paymentId}</strong>
      <div class="pid-label" style="margin-top:0.75rem;">Razorpay Order ID</div>
      <strong>${orderId}</strong>
      ${simBadge}
    `;
  } else {
    details.textContent = 'Payment details not available.';
  }
</script>
<script>lucide.createIcons();</script>
</body>
</html>
